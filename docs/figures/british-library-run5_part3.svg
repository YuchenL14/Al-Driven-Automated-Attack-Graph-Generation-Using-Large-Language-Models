<text x="14" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">How to read this figure</text>
<text x="14" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Rectangle: an action the adversary performed</text>
<text x="14" y="105.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Ellipse: a state the attack required or established</text>
<text x="14" y="117.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Dashed outline: an observation beside the attack,</text>
<text x="14" y="131.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   not a step in it</text>
<text x="14" y="144.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Arrows read downward: the node below depends</text>
<text x="14" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   on the node above</text>
<text x="14" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Shared horizontal line into an action: every input</text>
<text x="14" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   was needed (AND)</text>
<text x="14" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at an action&#x27;s top-left corner: ATT&amp;CK tactic,</text>
<text x="14" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s top right: ATT&amp;CK technique,</text>
<text x="14" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s bottom right: mitigation, keyed</text>
<text x="14" y="259.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   below</text>
<text x="14" y="272.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Number at an action&#x27;s bottom-left corner: how</text>
