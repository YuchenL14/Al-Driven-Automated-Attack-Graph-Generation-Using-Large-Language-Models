<text x="708.0" y="328.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222">4 recorded outcomes</text>
<text x="14" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">How to read this figure</text>
<text x="14" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Rectangle: an action the adversary performed</text>
<text x="14" y="105.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Ellipse: a state the attack required or established</text>
<text x="14" y="118.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Arrows read downward: the node below depends</text>
<text x="14" y="129.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   on the node above</text>
<text x="14" y="144.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at an action&#x27;s top-left corner: ATT&amp;CK tactic,</text>
<text x="14" y="157.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s top right: ATT&amp;CK technique,</text>
<text x="14" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s bottom right: mitigation, keyed</text>
<text x="14" y="207.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   below</text>
<text x="14" y="220.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Number at an action&#x27;s bottom-left corner: how</text>
<text x="14" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   feasible the step was judged to be, 0 to 10</text>
<text x="14" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">One shape stands for several nodes folded</text>
<text x="14" y="261.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   together; they are listed at the end of this key</text>
<text x="14" y="285.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1003.003: NTDS</text>
<text x="14" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1486: Data Encrypted for Impact</text>
<text x="14" y="326.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1026: Privileged Account Management</text>
<text x="14" y="337.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1027: Password Policies</text>
<text x="14" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1040: Behavior Prevention on Endpoint</text>
<text x="14" y="365.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1041: Encrypt Sensitive Information</text>
<text x="14" y="378.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1053: Data Backup</text>
<text x="14" y="402.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">CA: Credential Access</text>
<text x="14" y="417.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">IM: Impact</text>
<text x="14" y="441.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">4 recorded outcomes:</text>
<text x="14" y="456.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">= Servers and VMs encrypted</text>
<text x="14" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">= In-store contactless payments disrupted</text>
