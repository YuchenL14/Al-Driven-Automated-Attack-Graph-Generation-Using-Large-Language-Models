<text x="14" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading PRE: a</text>
<text x="14" y="194.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   condition that held before the attack</text>
<text x="14" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading RES: a</text>
<text x="14" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   state an action produced</text>
<text x="14" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s top right: ATT&amp;CK technique,</text>
<text x="14" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="259.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Number at an action&#x27;s bottom-left corner: how</text>
<text x="14" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   feasible the step was judged to be, 0 to 10</text>
