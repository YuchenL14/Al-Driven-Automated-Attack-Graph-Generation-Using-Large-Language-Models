<text x="14" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1018: User Account Management</text>
<text x="14" y="495.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1022: Restrict File and Directory Permissions</text>
<text x="14" y="508.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1030: Network Segmentation</text>
<text x="14" y="519.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1031: Network Intrusion Prevention</text>
<text x="14" y="532.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1037: Filter Network Traffic</text>
