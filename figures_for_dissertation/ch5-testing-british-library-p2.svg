<text x="14" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">How to read this figure</text>
<text x="14" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Rectangle: an action the adversary performed</text>
<text x="14" y="105.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Ellipse: a state the attack required or established</text>
<text x="14" y="117.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Dashed outline: an observation beside the attack,</text>
<text x="14" y="131.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   not a step in it</text>
<text x="14" y="144.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Arrows read downward: the node below depends</text>
<text x="14" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   on the node above</text>
<text x="14" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Shared horizontal line into an action: every input</text>
<text x="14" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   was needed (AND)</text>
<text x="14" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at an action&#x27;s top-left corner: kill-chain phase,</text>
<text x="14" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading PRE: a</text>
<text x="14" y="233.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   condition that held before the attack</text>
<text x="14" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading RES: a</text>
<text x="14" y="261.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   state an action produced</text>
<text x="14" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s top right: ATT&amp;CK technique,</text>
<text x="14" y="287.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s bottom right: mitigation, keyed</text>
<text x="14" y="311.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   below</text>
<text x="14" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Number at an action&#x27;s bottom-left corner: how</text>
<text x="14" y="339.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   feasible the step was judged to be, 0 to 10</text>
<text x="14" y="363.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1070.004: File Deletion</text>
<text x="14" y="376.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1136.002: Domain Account</text>
<text x="14" y="389.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1485: Data Destruction</text>
<text x="14" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1486: Data Encrypted for Impact</text>
<text x="14" y="417.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1490: Inhibit System Recovery</text>
<text x="14" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1018: User Account Management</text>
<text x="14" y="456.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1026: Privileged Account Management</text>
<text x="14" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1028: Operating System Configuration</text>
<text x="14" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1030: Network Segmentation</text>
<text x="14" y="493.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1032: Multi-factor Authentication</text>
