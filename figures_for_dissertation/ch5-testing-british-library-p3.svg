<text x="14" y="378.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1041: Encrypt Sensitive Information</text>
<text x="14" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">A: Actions on Objectives</text>
