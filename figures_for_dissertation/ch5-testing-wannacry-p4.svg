<text x="617.0" y="171.0" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#222222">T1490</text>
<circle cx="437.0" cy="247.0" r="13.0" fill="#31A8C4"/>
<text x="437.0" y="251.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222">7.0</text>
