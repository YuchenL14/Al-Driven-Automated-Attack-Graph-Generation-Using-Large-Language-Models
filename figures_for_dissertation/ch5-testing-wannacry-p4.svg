<rect x="436.0" y="170.0" width="176" height="78" fill="#FFFFFF" stroke="#303030" stroke-width="1"/>
<text x="524.0" y="206.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222">Delete volume shadow</text>
<text x="524.0" y="222.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222">copies to block recovery</text>
