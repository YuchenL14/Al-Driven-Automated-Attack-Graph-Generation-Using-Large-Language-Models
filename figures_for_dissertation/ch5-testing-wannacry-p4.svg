<rect x="613.0" y="272.0" width="36.0" height="11.0" fill="#E7BE9B" stroke="#8D6B57" stroke-width="0.6"/>
<text x="617.0" y="281.0" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#222222">M1053</text>
<rect x="550.0" y="284.0" width="176" height="78" fill="#FFFFFF" stroke="#303030" stroke-width="1" stroke-dasharray="7 5"/>
<text x="638.0" y="314.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222">Late-stage response</text>
<text x="638.0" y="330.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222">unlikely to reduce</text>
<text x="638.0" y="346.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222">impact</text>
<ellipse cx="410.0" cy="437.0" rx="88.0" ry="39.0" fill="#FFFFFF" stroke="#303030" stroke-width="1"/>
<text x="410.0" y="428.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222">Backup shadow</text>
<text x="410.0" y="444.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222">copies deleted,</text>
<text x="410.0" y="459.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222">recovery denied</text>
<circle cx="320.0" cy="394.0" r="13.0" fill="#CFCFC7"/>
<text x="320.0" y="398.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222">RES</text>
<text x="14" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">How to read this figure</text>
<text x="14" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Rectangle: an action the adversary performed</text>
<text x="14" y="105.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Ellipse: a state the attack required or established</text>
<text x="14" y="117.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Dashed outline: an observation beside the attack,</text>
<text x="14" y="131.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   not a step in it</text>
<text x="14" y="144.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Arrows read downward: the node below depends</text>
<text x="14" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   on the node above</text>
<text x="14" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at an action&#x27;s top-left corner: kill-chain phase,</text>
<text x="14" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading PRE: a</text>
<text x="14" y="207.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   condition that held before the attack</text>
<text x="14" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading RES: a</text>
<text x="14" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   state an action produced</text>
<text x="14" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s top right: ATT&amp;CK technique,</text>
<text x="14" y="261.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s bottom right: mitigation, keyed</text>
<text x="14" y="285.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   below</text>
<text x="14" y="298.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Number at an action&#x27;s bottom-left corner: how</text>
<text x="14" y="313.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   feasible the step was judged to be, 0 to 10</text>
<text x="14" y="326.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">One shape stands for several nodes folded</text>
<text x="14" y="339.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   together; they are listed at the end of this key</text>
<text x="14" y="365.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1490: Inhibit System Recovery</text>
<text x="14" y="391.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1018: User Account Management</text>
<text x="14" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1028: Operating System Configuration</text>
<text x="14" y="415.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1038: Execution Prevention</text>
<text x="14" y="430.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1053: Data Backup</text>
<text x="14" y="456.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">A: Actions on Objectives</text>
<text x="14" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">No single objective: the attack ends in 3</text>
<text x="14" y="495.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   independent outcomes, so none is named as the</text>
<text x="14" y="508.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   objective.</text>
</svg>