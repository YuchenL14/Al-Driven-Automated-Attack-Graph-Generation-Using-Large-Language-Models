<text x="14" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">How to read this figure</text>
<text x="14" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Rectangle: an action the adversary performed</text>
<text x="14" y="105.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Ellipse: a state the attack required or established</text>
<text x="14" y="117.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Dashed outline: an observation beside the attack,</text>
<text x="14" y="131.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   not a step in it</text>
<text x="14" y="144.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Arrows read downward: the node below depends</text>
<text x="14" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   on the node above</text>
<text x="14" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Shared horizontal line into an action: every input</text>
<text x="14" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   was needed (AND)</text>
<text x="14" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at an action&#x27;s top-left corner: kill-chain phase,</text>
<text x="14" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading PRE: a</text>
<text x="14" y="233.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   condition that held before the attack</text>
<text x="14" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading RES: a</text>
<text x="14" y="261.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   state an action produced</text>
<text x="14" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading EXT: a</text>
<text x="14" y="287.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   resource the adversary already held</text>
<text x="14" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s top right: ATT&amp;CK technique,</text>
<text x="14" y="313.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="326.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s bottom right: mitigation, keyed</text>
<text x="14" y="337.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   below</text>
<text x="14" y="350.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Number at an action&#x27;s bottom-left corner: how</text>
<text x="14" y="365.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   feasible the step was judged to be, 0 to 10</text>
<text x="14" y="391.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">The attack&#x27;s objective, at the foot of the figure:</text>
<text x="14" y="402.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   Ransom/extortion demand issued to M&amp;S</text>
<text x="14" y="430.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1486: Data Encrypted for Impact</text>
<text x="14" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1490: Inhibit System Recovery</text>
<text x="14" y="456.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1499.004: Application or System Exploitation</text>
<text x="14" y="467.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1657: Financial Theft</text>
<text x="14" y="495.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1017: User Training</text>
<text x="14" y="508.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1018: User Account Management</text>
<text x="14" y="521.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1028: Operating System Configuration</text>
<text x="14" y="532.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1037: Filter Network Traffic</text>
<text x="14" y="545.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1038: Execution Prevention</text>
<text x="14" y="560.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1040: Behavior Prevention on Endpoint</text>
<text x="14" y="573.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1053: Data Backup</text>
