<circle cx="618.0" cy="622.0" r="13.0" fill="#CFCFC7"/>
<text x="618.0" y="626.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222">RES</text>
<text x="14" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">How to read this figure</text>
<text x="14" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Rectangle: an action the adversary performed</text>
<text x="14" y="105.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Ellipse: a state the attack required or established</text>
<text x="14" y="118.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Arrows read downward: the node below depends</text>
<text x="14" y="129.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   on the node above</text>
<text x="14" y="144.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Shared horizontal line into an action: every input</text>
<text x="14" y="157.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   was needed (AND)</text>
<text x="14" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at an action&#x27;s top-left corner: kill-chain phase,</text>
<text x="14" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading PRE: a</text>
<text x="14" y="207.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   condition that held before the attack</text>
<text x="14" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading RES: a</text>
<text x="14" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   state an action produced</text>
<text x="14" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Circle at a state&#x27;s top-left corner reading EXT: a</text>
<text x="14" y="261.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   resource the adversary already held</text>
<text x="14" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s top right: ATT&amp;CK technique,</text>
<text x="14" y="287.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   keyed below</text>
<text x="14" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Tags at an action&#x27;s bottom right: mitigation, keyed</text>
<text x="14" y="311.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   below</text>
<text x="14" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">Number at an action&#x27;s bottom-left corner: how</text>
<text x="14" y="339.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   feasible the step was judged to be, 0 to 10</text>
<text x="14" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">One shape stands for several nodes folded</text>
<text x="14" y="365.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   together; they are listed at the end of this key</text>
<text x="14" y="389.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1021.002: SMB/Windows Admin Shares</text>
<text x="14" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1046: Network Service Discovery</text>
<text x="14" y="417.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">T1210: Exploitation of Remote Services</text>
<text x="14" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1016: Vulnerability Scanning</text>
<text x="14" y="456.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1019: Threat Intelligence Program</text>
<text x="14" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1026: Privileged Account Management</text>
<text x="14" y="480.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1027: Password Policies</text>
<text x="14" y="495.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1030: Network Segmentation</text>
<text x="14" y="506.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1031: Network Intrusion Prevention</text>
<text x="14" y="519.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1035: Limit Access to Resource Over Network</text>
<text x="14" y="532.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1037: Filter Network Traffic</text>
<text x="14" y="547.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1042: Disable or Remove Feature or Program</text>
<text x="14" y="560.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1048: Application Isolation and Sandboxing</text>
<text x="14" y="573.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1050: Exploit Protection</text>
<text x="14" y="586.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">M1051: Update Software</text>
<text x="14" y="612.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">A: Actions on Objectives</text>
<text x="14" y="638.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">No single objective: the attack ends in 8</text>
<text x="14" y="651.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   independent outcomes, so none is named as the</text>
<text x="14" y="664.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222">   objective.</text>
</svg>